# =============================================================================
# MRU-Forecast — full stack.
#
#     docker compose up --build
#
# Order of operations: `trainer` runs once (download -> clean -> train) and
# exits; `api` and `dashboard` wait for its artefacts, then serve.  The three
# share the same image and the same named volumes, so the models trained once
# are the models served.
#
# Profiles keep the optional pieces optional:
#     docker compose --profile mlflow up      # + MLflow tracking UI
#     docker compose --profile postgres up    # + PostgreSQL
#     docker compose --profile backtest run backtest
# =============================================================================

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: mru-forecast:latest
  env_file:
    - .env
  environment:
    MRU_CONFIG_PATH: configs/config.yaml
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/mlruns/mlflow.db}
  volumes:
    - mru-data:/app/data
    - mru-models:/app/models
    - mru-reports:/app/reports
    - mru-mlruns:/app/mlruns
  restart: unless-stopped

services:
  # --- one-shot: fetch data, clean it, train and calibrate the predictors ---
  # download -> clean -> train -> fast backtest (the last one populates the
  # dashboard's Model-comparison and Uncertainty pages).
  # Idempotent: exits immediately once the artefacts exist.
  #   FORCE_RETRAIN=1 docker compose up trainer   rebuild everything
  #   SKIP_BACKTEST=1 docker compose up           train only, ~70s faster
  trainer:
    <<: *app
    container_name: mru-trainer
    command: ["pipeline"]
    restart: "no"
    environment:
      MRU_CONFIG_PATH: configs/config.yaml
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/mlruns/mlflow.db}
      FORCE_RETRAIN: ${FORCE_RETRAIN:-0}
      SKIP_BACKTEST: ${SKIP_BACKTEST:-0}

  # --- REST API ------------------------------------------------------------
  api:
    <<: *app
    container_name: mru-api
    command: ["api"]
    environment:
      MRU_CONFIG_PATH: configs/config.yaml
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/mlruns/mlflow.db}
      # Fixed inside the container; API_PORT below only picks the host port.
      SERVER_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # --- Streamlit dashboard -------------------------------------------------
  dashboard:
    <<: *app
    container_name: mru-dashboard
    command: ["dashboard"]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      trainer:
        condition: service_completed_successfully
    environment:
      MRU_CONFIG_PATH: configs/config.yaml
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/mlruns/mlflow.db}
      API_BASE_URL: http://api:8000
      # Fixed inside the container; DASHBOARD_PORT only picks the host port.
      SERVER_PORT: 8501
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # --- optional: full backtest (slow; run on demand) -----------------------
  backtest:
    <<: *app
    container_name: mru-backtest
    command: ["backtest"]
    restart: "no"
    profiles: ["backtest"]
    depends_on:
      trainer:
        condition: service_completed_successfully

  # --- optional: MLflow tracking UI ---------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: mru-mlflow
    profiles: ["mlflow"]
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0 --port 5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mru-mlruns:/mlruns
    restart: unless-stopped

  # --- optional: PostgreSQL ------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mru-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-mru_forecast}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mru-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mru}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mru-data:
  mru-models:
  mru-reports:
  mru-mlruns:
  mru-postgres:
