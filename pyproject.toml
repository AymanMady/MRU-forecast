[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mru-forecast"
version = "0.1.0"
description = "Mauritanian Ouguiya (MRU) exchange rate forecasting with conformal prediction intervals"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bechir" }]
keywords = ["time-series", "forecasting", "conformal-prediction", "exchange-rates", "mlops"]

dependencies = [
    # --- core data ---
    "pandas>=2.2",
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "pyarrow>=16.0",            # parquet I/O for processed datasets
    # --- modelling ---
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "prophet>=1.1.6",
    "statsmodels>=0.14",        # ACF/PACF, stationarity tests (EDA)
    "mapie>=0.9",               # reference implementation to cross-check our conformal code
    # --- config & io ---
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "requests>=2.32",
    # --- visualisation ---
    "plotly>=5.24",
    "streamlit>=1.39",
    # --- api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # --- experiment tracking ---
    "mlflow>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",           # required by plotly inside notebooks
    "kaleido>=0.2.1",           # static export of plotly figures for the README
]

[project.urls]
Repository = "https://github.com/bechir/mru-forecast"

# ----------------------------------------------------------------------------
# Packaging: the importable package lives in src/ (src-layout).
# `pip install -e .` makes `import mru_forecast` work in notebooks, tests,
# the API and the dashboard without any sys.path manipulation.
# ----------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------
# Ruff: linter + formatter (replaces flake8 + isort + black)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "api", "dashboard", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "PD",       # pandas-vet
    "NPY",      # numpy rules
    "RUF",
]
ignore = [
    "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Notebooks re-import per section on purpose so individual cells run standalone.
"notebooks/*" = ["E402", "F401", "F811", "I001", "E702"]
# This script is mostly prose destined for markdown cells; mathematical
# typography (x, -, alpha, en dashes) is correct there, not an ambiguous glyph.
"scripts/make_notebooks.py" = ["RUF001", "RUF002", "RUF003"]
# N802/N806: `X` for a design matrix and camelCase test names are ML conventions.
"tests/*" = ["N802", "N806"]
# B008: `Depends(...)` in a default is the documented FastAPI idiom, not a bug.
"api/*" = ["B008"]

[tool.ruff.format]
quote-style = "double"
# Notebooks are generated by `scripts/make_notebooks.py` and formatted by it.
# Reformatting them here would make them differ from their generator on every
# regeneration. `ruff check` still lints them.
exclude = ["notebooks/*.ipynb"]

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: tests that train a model (deselect with '-m \"not slow\"')",
    "network: tests that hit an external API",
]
